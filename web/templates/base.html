<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/styles.css" />
  <title>{{ if .Title }}{{ .Title }} | arjun{{ else }}arjun{{ end }}</title>
  {{ if .Description }}<meta name="description" content="{{ .Description }}">{{ end }}

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}arjun{{ end }}">
  {{ if .Description }}<meta property="og:description" content="{{ .Description }}">{{ end }}
  <meta property="og:image" content="/static/images/img.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@array0111">
  <meta name="twitter:title" content="{{ if .Title }}{{ .Title }}{{ else }}arjun{{ end }}">
  {{ if .Description }}<meta name="twitter:description" content="{{ .Description }}">{{ end }}
  <meta name="twitter:image" content="/static/images/img.jpg">

  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
  <link rel="icon" type="image/jpeg" href="/static/images/img.jpg">
</head>

<body hx-boost="true">
  <div class="site-wrapper">
    <header class="site-header">
      <div class="header-top">
        <div class="header-brand">
          <logo class="logo"><span class="logo-cmd">ssh</span> <span class="logo-user">user</span><span class="logo-at">@</span><span class="logo-host">arjunomray.com</span></logo>
          {{ template "templates/components/lofi.html" . }}
        </div>
        <img class="header-avatar" src="/static/images/img.jpg" alt="Arjun">
      </div>
      {{ template "templates/components/nav.html" . }}
    </header>

    <script>
      // Global navigation keybindings: [m] -> /me, [w] -> /work, [b] -> /blogs, [l] -> /library
      document.addEventListener('keydown', function(e) {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) {
          return;
        }
        const key = e.key.toLowerCase();
        if (key === 'm') {
          const link = document.querySelector('a[data-key="m"]');
          if (link) link.click();
        } else if (key === 'w') {
          const link = document.querySelector('a[data-key="w"]');
          if (link) link.click();
        } else if (key === 'b') {
          const link = document.querySelector('a[data-key="b"]');
          if (link) link.click();
        } else if (key === 'l') {
          const link = document.querySelector('a[data-key="l"]');
          if (link) link.click();
        }
      });
    </script>
    <section class="site-main-section">
      <main class="main-content-card">
        {{ block "content" . }}
        {{ end }}
      </main>
    </section>
    {{ template "templates/components/footer.html" }}
  </div>

</body>

</html>

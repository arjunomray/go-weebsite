<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/styles.css" />
  <title>{{ if .Title }}{{ .Title }} | arjun{{ else }}arjun{{ end }}</title>
  {{ if .Description }}<meta name="description" content="{{ .Description }}">{{ end }}

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}arjun{{ end }}">
  {{ if .Description }}<meta property="og:description" content="{{ .Description }}">{{ end }}
  <meta property="og:image" content="/static/images/img.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@array0111">
  <meta name="twitter:title" content="{{ if .Title }}{{ .Title }}{{ else }}arjun{{ end }}">
  {{ if .Description }}<meta name="twitter:description" content="{{ .Description }}">{{ end }}
  <meta name="twitter:image" content="/static/images/img.jpg">

  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
  <link rel="icon" type="image/jpeg" href="/static/images/img.jpg">
</head>

<body hx-boost="true">
  <div class="site-wrapper">
    <header class="site-header">
      <div class="header-top">
        <div class="header-brand">
          <logo class="logo"><span class="logo-cmd">ssh</span> <span class="logo-user">user</span><span class="logo-at">@</span><span class="logo-host">arjunomray.com</span></logo>
          {{ template "templates/components/lofi.html" . }}
        </div>
        <img class="header-avatar" src="/static/images/img.jpg" alt="Arjun">
      </div>
      {{ template "templates/components/nav.html" . }}
    </header>

    <script>
      // Color Schemes definition (dark and light variants)
      const THEMES = [
        'gruvbox',
        'gruvbox-light',
        'nord',
        'nord-light',
        'rose-pine',
        'rose-pine-light',
        'catppuccin',
        'catppuccin-light',
        'everforest',
        'everforest-light'
      ];
      
      function applyTheme(theme, originEvent) {
        if (!THEMES.includes(theme)) theme = 'gruvbox';
        
        const updateDOM = () => {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('user-theme', theme);
          const display = document.getElementById('theme-display');
          if (display) display.innerText = theme;
        };

        // If browser doesn't support View Transitions or user prefers reduced motion, apply instantly
        if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          updateDOM();
          return;
        }

        // Calculate origin point of the click or default to top-left / screen center
        let x = window.innerWidth / 2;
        let y = window.innerHeight / 2;

        if (originEvent && originEvent.clientX !== undefined) {
          x = originEvent.clientX;
          y = originEvent.clientY;
        } else {
          const themeDisplay = document.getElementById('theme-display') || document.querySelector('a[data-key="c"]');
          if (themeDisplay) {
            const rect = themeDisplay.getBoundingClientRect();
            x = rect.left + rect.width / 2;
            y = rect.top + rect.height / 2;
          }
        }

        // Calculate distance to the furthest corner to expand the circle
        const endRadius = Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y)
        );

        const transition = document.startViewTransition(updateDOM);

        transition.ready.then(() => {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0px at ${x}px ${y}px)`,
                `circle(${endRadius}px at ${x}px ${y}px)`
              ]
            },
            {
              duration: 450,
              easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
              pseudoElement: '::view-transition-new(root)'
            }
          );
        });
      }

      function cycleTheme(event) {
        const current = document.documentElement.getAttribute('data-theme') || 'gruvbox';
        const currentIndex = THEMES.indexOf(current);
        const nextIndex = (currentIndex + 1) % THEMES.length;
        const nextTheme = THEMES[nextIndex];
        applyTheme(nextTheme, event);
      }

      // Initialize saved theme immediately on load / page swap (no animation on first load)
      const savedTheme = localStorage.getItem('user-theme') || 'gruvbox';
      document.documentElement.setAttribute('data-theme', savedTheme);
      localStorage.setItem('user-theme', savedTheme);
      const initialDisplay = document.getElementById('theme-display');
      if (initialDisplay) initialDisplay.innerText = savedTheme;

      // Re-sync display on htmx boost swaps
      document.addEventListener('htmx:afterSettle', function() {
        const current = document.documentElement.getAttribute('data-theme') || 'gruvbox';
        const display = document.getElementById('theme-display');
        if (display) display.innerText = current;
      });

      // Global navigation keybindings: [m] -> /me, [w] -> /work, [b] -> /blogs, [l] -> /library, [c] -> cycle theme
      document.addEventListener('keydown', function(e) {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) {
          return;
        }
        const key = e.key.toLowerCase();
        if (key === 'm') {
          const link = document.querySelector('a[data-key="m"]');
          if (link) link.click();
        } else if (key === 'w') {
          const link = document.querySelector('a[data-key="w"]');
          if (link) link.click();
        } else if (key === 'b') {
          const link = document.querySelector('a[data-key="b"]');
          if (link) link.click();
        } else if (key === 'l') {
          const link = document.querySelector('a[data-key="l"]');
          if (link) link.click();
        } else if (key === 'c') {
          cycleTheme();
        }
      });
    </script>
    <section class="site-main-section">
      <main class="main-content-card">
        {{ block "content" . }}
        {{ end }}
      </main>
    </section>
    {{ template "templates/components/footer.html" }}
  </div>

</body>

</html>

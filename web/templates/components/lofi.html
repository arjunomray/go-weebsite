{{ define "templates/components/lofi.html" }}
<div class="lofi-widget" id="lofi-widget" hx-preserve="true">
  <div class="lofi-controls">
    <button id="lofi-toggle" class="lofi-btn" onclick="toggleLofi()">
      [<span id="lofi-status">OFF</span>] lofi_player
    </button>

    <button id="lofi-next" class="lofi-btn skip-btn" onclick="skipTrack()" title="Skip Track">
      [>>]
    </button>
  </div>

  <div class="theme-indicator">
    <button class="theme-btn" onclick="cycleTheme()" title="Cycle colorscheme [c]">
      theme: <span id="theme-display" class="theme-name-display">gruvbox</span>
    </button>
  </div>

  <audio id="lofi-player" preload="none"></audio>
</div>

<script>
  if (!window._lofiInitialized) {
    window._lofiInitialized = true;
    window._lofiPlaylist = [
      "/static/audio/track1.mp3",
      "/static/audio/track2.mp3",
      "/static/audio/track3.mp3",
      "/static/audio/track4.mp3",
      "/static/audio/track5.mp3",
      "/static/audio/track6.mp3",
      "/static/audio/track7.mp3",
      "/static/audio/track8.mp3",
      "/static/audio/track9.mp3",
      "/static/audio/track10.mp3",
    ];
    window._lofiLastTrack = null;

    window.getRandomTrack = function() {
      const choices = window._lofiPlaylist.filter(track => track !== window._lofiLastTrack);
      const randomChoice = choices[Math.floor(Math.random() * choices.length)];
      window._lofiLastTrack = randomChoice;
      return randomChoice;
    };

    window.toggleLofi = function() {
      const player = document.getElementById('lofi-player');
      const status = document.getElementById('lofi-status');
      if (!player) return;

      if (!player.src) {
        player.src = window.getRandomTrack();
      }

      if (player.paused) {
        player.play().then(() => {
          if (status) {
            status.innerText = "PLAYING";
            status.style.color = "#b8bb26"; // Gruvbox Green
          }
        }).catch(err => {
          console.error("Audio playback failed:", err);
        });
      } else {
        player.pause();
        if (status) {
          status.innerText = "OFF";
          status.style.color = "";
        }
      }
    };

    window.skipTrack = function() {
      const player = document.getElementById('lofi-player');
      const status = document.getElementById('lofi-status');
      if (!player) return;

      player.src = window.getRandomTrack();
      player.play().then(() => {
        if (status) {
          status.innerText = "PLAYING";
          status.style.color = "#b8bb26";
        }
      }).catch(err => {
        console.error("Skip action playback failed:", err);
      });
    };

    document.addEventListener('DOMContentLoaded', function() {
      const player = document.getElementById('lofi-player');
      if (player) {
        player.addEventListener('ended', window.skipTrack);
      }
    });
  }
</script>
{{ end }}
